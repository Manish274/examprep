[project]
name = "examprep-rag"
version = "0.1.0"
description = "RAG service: parsing, chunking, embeddings, hybrid retrieval, reranking, generation and evaluation"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF001",  # "›" in citation headers is a deliberate display choice
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Loads PyMuPDF before collection begins. See pymupdf_preload.py -- without
# it, the first import of the native extension mid-run faults on Windows.
addopts = "-p pymupdf_preload"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
